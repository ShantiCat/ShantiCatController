[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shanti-cat-controller"
version = "0.1.0"
description = "Controller for Shanti Cat Collar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bleak>=1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]